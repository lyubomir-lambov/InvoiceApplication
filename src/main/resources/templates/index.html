<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Основна навигация">
        <a th:href="@{/register}">Register</a>
        <a th:href="@{/login}">Login</a>
    </nav>
</header>

<main>
    <section class="hero">
        <div class="hero-content">
            <h1>Управление на фактури на едно място</h1>
            <p>
                Създавайте, преглеждайте и следете фактурите си бързо и подредено.
                Приложението е подготвено за потребители, роли и бъдещи работни процеси по фактуриране.
            </p>
            <div class="actions">
                <a class="button button-primary" th:href="@{/register}">Register</a>
                <a class="button button-secondary" th:href="@{/login}">Login</a>
            </div>
        </div>

        <div class="hero-image">
            <img th:src="@{/images/index-image.png}" src="/images/index-image.png" alt="Invoice dashboard preview">
        </div>
    </section>
</main>
</body>
</html>
