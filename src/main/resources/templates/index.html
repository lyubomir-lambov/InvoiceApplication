<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a th:href="@{/register}">Register</a>
        <a th:href="@{/login}">Login</a>
    </nav>
</header>

<main>
    <section class="hero">
        <div class="hero-content">
            <h1>Manage invoices in one place</h1>
            <p>
                Create, review, and track your invoices quickly and efficiently.
                The application is ready for users, roles, and future invoicing workflows.
            </p>
            <div class="actions">
                <a class="button button-primary" th:href="@{/register}">Register</a>
                <a class="button button-secondary" th:href="@{/login}">Login</a>
            </div>
        </div>

        <div class="hero-image">
            <img th:src="@{/images/index-image.png}" src="/images/index-image.png" alt="Invoice dashboard preview">
        </div>
    </section>
</main>
</body>
</html>
