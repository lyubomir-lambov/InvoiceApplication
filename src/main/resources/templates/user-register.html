<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
</header>

<main>
    <section class="auth">
        <div class="auth-panel">
            <div class="auth-header">
                <h1>Create account</h1>
                <p>Register to start managing your invoices.</p>
            </div>

            <form class="auth-form" th:action="@{/users/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" th:field="*{username}" autocomplete="username" required>
                    <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</p>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Confirm password</label>
                    <input id="passwordConfirm" type="password" th:field="*{passwordConfirm}" autocomplete="new-password" required>
                    <p class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">Password confirmation error</p>
                </div>

                <button class="button button-primary form-submit" type="submit">Register</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
