<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a class="nav-button" th:href="@{/invoices}" href="/invoices">Invoices</a>
        <a class="nav-button nav-button-active" th:href="@{/clients}" href="/clients">Clients</a>
        <a class="nav-button" th:href="@{/payments}" href="/payments">Payments</a>
        <a class="nav-button" th:href="@{/payment-reports}" href="/payment-reports">Payment Reports</a>
        <a class="nav-button" th:if="${isAdmin}" th:href="@{/users}" href="/users">Users</a>
    </nav>
    <nav class="navigation" aria-label="User navigation" style="margin-left: auto;">
        <span th:text="${username}" style="display: inline-flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 15px; font-weight: 700;">username</span>
        <form th:action="@{/logout}" action="/logout" method="post" style="margin: 0;">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="list-page">
    <section class="content-shell">
        <div class="section-actions">
            <a class="nav-button" th:href="@{/clients/create}" href="/clients/create">Add client</a>
            <form th:action="@{/clients}" action="/clients" method="get" style="display: inline-flex; align-items: center; gap: 10px; margin: 0 0 0 10px;">
                <input type="search"
                       name="clientName"
                       th:value="${clientName}"
                       placeholder="Search by client name"
                       aria-label="Search by client name"
                       onsearch="if (!this.value) this.form.submit();"
                       style="min-height: 40px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 15px; font-weight: 700; background: var(--surface);">
                <button class="nav-button" type="submit">Search</button>
            </form>
        </div>

        <p class="field-error"
           th:if="${message != null}"
           th:text="${message}"
           style="margin: 0 0 16px;">Client message</p>

        <div class="table-card">
            <table class="clients-table">
                <thead>
                <tr>
                    <th>Client</th>
                    <th>Contact</th>
                    <th>Address</th>
                    <th>VAT</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(clients)}">
                    <td colspan="6">No clients found.</td>
                </tr>
                <tr th:each="client : ${clients}">
                    <td>
                        <span class="client-table-primary" th:text="${client.displayName}">Acme Sofia</span>
                        <span class="client-table-secondary" th:text="${client.companyName}">Acme Bulgaria Ltd.</span>
                    </td>
                    <td>
                        <span class="client-table-primary" th:text="${client.email}">billing@acme.bg</span>
                        <span class="client-table-secondary" th:text="${client.phoneNumber}">+359 888 123 456</span>
                    </td>
                    <td>
                        <span class="client-table-primary" th:text="${client.country}">BULGARIA</span>
                        <span class="client-table-secondary" th:text="${client.address}">15 Vitosha Blvd, Sofia</span>
                    </td>
                    <td>
                        <span class="client-table-primary" th:text="${client.vatRegistered ? 'Yes' : 'No'}">Yes</span>
                        <span class="client-table-secondary" th:text="${client.vatNumber != null && !client.vatNumber.isBlank() ? client.vatNumber : '-'}">BG123456789</span>
                    </td>
                    <td class="client-table-status">
                        <form class="status-switch-form"
                              th:action="@{/clients/{id}/toggle-status(id=${client.id})}"
                              action="/clients/client-id/toggle-status"
                              method="post">
                            <button class="status-badge status-toggle-button"
                                    th:classappend="${client.active ? ' status-active' : ' status-inactive'}"
                                    type="submit"
                                    th:attr="title=${client.active ? 'Set inactive' : 'Set active'}"
                                    th:text="${client.active ? 'Active' : 'Inactive'}">Active</button>
                        </form>
                    </td>
                    <td class="client-table-actions">
                        <div class="client-actions">
                            <a class="nav-button"
                               th:href="@{/clients/edit/{id}(id=${client.id})}"
                               href="/clients/edit/client-id">Edit</a>
                            <form th:if="${isAdmin}"
                                  th:action="@{/clients/{id}/delete(id=${client.id})}"
                                  action="/clients/client-id/delete"
                                  method="post"
                                  style="margin: 0;">
                                <button class="button button-danger"
                                        type="submit"
                                        onclick="return confirm('Delete this client?');">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
