<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a class="nav-button" th:href="@{/invoices}" href="/invoices">Invoices</a>
        <a class="nav-button nav-button-active" th:href="@{/clients}" href="/clients">Clients</a>
    </nav>
    <nav class="navigation" aria-label="User navigation" style="margin-left: auto;">
        <span th:text="${username}" style="display: inline-flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 15px; font-weight: 700;">username</span>
        <form th:action="@{/logout}" action="/logout" method="post" style="margin: 0;">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="list-page">
    <section class="content-shell">
        <div class="section-actions">
            <a class="nav-button" th:href="@{/clients/create}" href="/clients/create">Add client</a>
            <form th:action="@{/clients}" action="/clients" method="get" style="display: inline-flex; align-items: center; gap: 10px; margin: 0 0 0 10px;">
                <input type="search"
                       name="clientName"
                       th:value="${clientName}"
                       placeholder="Search by client name"
                       aria-label="Search by client name"
                       style="min-height: 40px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 15px; font-weight: 700; background: var(--surface);">
                <button class="nav-button" type="submit">Search</button>
            </form>
        </div>

        <div class="table-card">
            <table class="clients-table">
                <thead>
                <tr>
                    <th>Display Name</th>
                    <th>Company Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Country</th>
                    <th>Address</th>
                    <th>VAT</th>
                    <th>VAT Number</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(clients)}">
                    <td colspan="10">No clients found.</td>
                </tr>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.displayName}">Acme Sofia</td>
                    <td th:text="${client.companyName}">Acme Bulgaria Ltd.</td>
                    <td th:text="${client.email}">billing@acme.bg</td>
                    <td th:text="${client.phoneNumber}">+359 888 123 456</td>
                    <td th:text="${client.country}">BULGARIA</td>
                    <td th:text="${client.address}">15 Vitosha Blvd, Sofia</td>
                    <td th:text="${client.vatRegistered ? 'Yes' : 'No'}">Yes</td>
                    <td th:text="${client.vatNumber != null && !client.vatNumber.isBlank() ? client.vatNumber : '-'}">BG123456789</td>
                    <td>
                        <form class="status-switch-form"
                              th:action="@{/clients/{id}/toggle-status(id=${client.id})}"
                              action="/clients/client-id/toggle-status"
                              method="post">
                            <button class="status-badge status-toggle-button"
                                    th:classappend="${client.active ? ' status-active' : ' status-inactive'}"
                                    type="submit"
                                    th:attr="title=${client.active ? 'Set inactive' : 'Set active'}"
                                    th:text="${client.active ? 'Active' : 'Inactive'}">Active</button>
                        </form>
                    </td>
                    <td>
                        <a class="nav-button"
                           th:href="@{/clients/edit/{id}(id=${client.id})}"
                           href="/clients/edit/client-id">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
