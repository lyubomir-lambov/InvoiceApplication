<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a class="nav-button nav-button-active" th:href="@{/invoices}" href="/invoices">Invoices</a>
        <a class="nav-button" th:href="@{/clients}" href="/clients">Clients</a>
    </nav>
    <nav class="navigation" aria-label="User navigation" style="margin-left: auto;">
        <span>username</span>
        <form th:action="@{/logout}" action="/logout" method="post" style="margin: 0;">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="list-page">
    <section class="content-shell">
        <div class="table-card">
            <table class="invoices-table">
                <thead>
                <tr>
                    <th>Invoice</th>
                    <th>Client</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>INV-2026-001</td>
                    <td>Acme Ltd.</td>
                    <td>1,250.00 BGN</td>
                    <td><span class="status-badge status-paid">Paid</span></td>
                </tr>
                <tr>
                    <td>INV-2026-002</td>
                    <td>Balkan Trade</td>
                    <td>840.00 BGN</td>
                    <td><span class="status-badge status-pending">Pending</span></td>
                </tr>
                <tr>
                    <td>INV-2026-003</td>
                    <td>Sofia Consulting</td>
                    <td>2,400.00 BGN</td>
                    <td><span class="status-badge status-overdue">Overdue</span></td>
                </tr>
                <tr>
                    <td>INV-2026-004</td>
                    <td>Green Office</td>
                    <td>630.00 BGN</td>
                    <td><span class="status-badge status-draft">Draft</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
