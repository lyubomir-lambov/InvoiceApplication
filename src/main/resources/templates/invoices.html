<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a class="nav-button nav-button-active" th:href="@{/invoices}" href="/invoices">Invoices</a>
        <a class="nav-button" th:href="@{/clients}" href="/clients">Clients</a>
        <a class="nav-button" th:href="@{/payments}" href="/payments">Payments</a>
        <a class="nav-button" th:href="@{/payment-reports}" href="/payment-reports">Payment Reports</a>
    </nav>
    <nav class="navigation" aria-label="User navigation" style="margin-left: auto;">
        <span th:text="${username}" style="display: inline-flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 15px; font-weight: 700;">username</span>
        <form th:action="@{/logout}" action="/logout" method="post" style="margin: 0;">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="list-page">
    <section class="content-shell">
        <div class="section-actions">
            <a class="nav-button" th:href="@{/invoices/create}" href="/invoices/create">Create invoice</a>
            <form th:action="@{/invoices}" action="/invoices" method="get" style="display: inline-flex; align-items: center; gap: 10px; margin: 0 0 0 10px;">
                <input type="search"
                       name="companyName"
                       th:value="${companyName}"
                       placeholder="Search by company name"
                       aria-label="Search by company name"
                       onsearch="if (!this.value) this.form.submit();"
                       style="min-height: 40px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 15px; font-weight: 700; background: var(--surface);">
                <button class="nav-button" type="submit">Search</button>
            </form>
        </div>

        <div class="table-card">
            <table class="invoices-table">
                <thead>
                <tr>
                    <th>Invoice</th>
                    <th>Issue date</th>
                    <th>Type</th>
                    <th>Client</th>
                    <th>Amount</th>
                    <th>Currency</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(invoices)}">
                    <td colspan="7">No invoices found.</td>
                </tr>
                <tr th:each="invoice : ${invoices}"
                    th:classappend="${invoice.status.name() == 'CANCELLED'} ? 'invoice-cancelled-row'">
                    <td>
                        <div class="invoice-number-cell">
                            <a class="invoice-link-icon"
                               th:href="@{/invoices/{invoiceId}(invoiceId=${invoice.id})}"
                               href="/invoices/00000000-0000-0000-0000-000000000000"
                               aria-label="Open invoice"
                               title="Open invoice">
                                <span aria-hidden="true">i</span>
                            </a>
                            <span th:text="${invoice.invoiceNumber}">0000000001</span>
                        </div>
                    </td>
                    <td th:text="${invoice.issueDate}">2026-06-19</td>
                    <td th:text="${invoice.invoiceType.displayName}">Invoice</td>
                    <td th:text="${invoice.clientCompanyName}">Acme Ltd.</td>
                    <td th:text="${invoice.totalAmount}"
                        th:classappend="${invoice.invoiceType.name() == 'CREDIT_NOTE'} ? 'invoice-credit-amount'">0.00</td>
                    <td th:text="${invoice.currency.code}">BGN</td>
                    <td>
                        <a class="nav-button"
                           th:href="@{/invoices/edit/{invoiceId}(invoiceId=${invoice.id})}"
                           href="/invoices/edit/00000000-0000-0000-0000-000000000000">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
