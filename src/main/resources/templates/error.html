<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status + ' | Invoice Application'}">Error | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a class="nav-button" sec:authorize="isAuthenticated()" th:href="@{/invoices}" href="/invoices">Invoices</a>
        <a class="nav-button" sec:authorize="isAuthenticated()" th:href="@{/clients}" href="/clients">Clients</a>
        <a class="nav-button" sec:authorize="isAuthenticated()" th:href="@{/payments}" href="/payments">Payments</a>
        <a class="nav-button" sec:authorize="isAuthenticated()" th:href="@{/payment-reports}" href="/payment-reports">Payment Reports</a>
        <a class="nav-button" sec:authorize="hasRole('ADMIN')" th:href="@{/users}" href="/users">Users</a>
    </nav>
    <nav class="navigation" aria-label="User navigation" style="margin-left: auto;">
        <a class="nav-button" sec:authorize="isAnonymous()" th:href="@{/login}" href="/login">Login</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" action="/logout" method="post" style="margin: 0;">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main>
    <section class="error-panel">
        <p class="error-status" th:text="${status}">404</p>
        <h1 th:text="${errorTitle}">Resource Not Found</h1>
        <p th:text="${message}">The requested resource was not found.</p>
        <p class="error-path" th:text="${path}">/invoices/invalid-id</p>
        <a class="button button-primary" th:href="@{/invoices}" href="/invoices">Back to invoices</a>
    </section>
</main>
</body>
</html>
