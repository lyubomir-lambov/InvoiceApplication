<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Reports | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a class="nav-button" th:href="@{/invoices}" href="/invoices">Invoices</a>
        <a class="nav-button" th:href="@{/clients}" href="/clients">Clients</a>
        <a class="nav-button" th:href="@{/payments}" href="/payments">Payments</a>
        <a class="nav-button nav-button-active" th:href="@{/payment-reports}" href="/payment-reports">Payment Reports</a>
    </nav>
    <nav class="navigation" aria-label="User navigation" style="margin-left: auto;">
        <span th:text="${username}" style="display: inline-flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 15px; font-weight: 700;">username</span>
        <form th:action="@{/logout}" action="/logout" method="post" style="margin: 0;">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="list-page">
    <section class="content-shell">
        <div class="auth-header">
            <h1>Payment Reports</h1>
            <p>Totals by currency for issued invoices, payments, and outstanding amounts.</p>
        </div>

        <div class="table-card">
            <table class="invoices-table">
                <thead>
                <tr>
                    <th>Currency</th>
                    <th>Invoice total</th>
                    <th>Payment total</th>
                    <th>Due amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reports}">
                    <td th:text="${report.currency.code}">BGN</td>
                    <td th:classappend="${report.invoiceTotal.signum() < 0} ? 'invoice-credit-amount'"
                        th:text="${#numbers.formatDecimal(report.invoiceTotal, 1, 2)}">0.00</td>
                    <td th:classappend="${report.paymentTotal.signum() < 0} ? 'invoice-credit-amount'"
                        th:text="${#numbers.formatDecimal(report.paymentTotal, 1, 2)}">0.00</td>
                    <td th:classappend="${report.dueAmount.signum() < 0} ? 'invoice-credit-amount'"
                        th:text="${#numbers.formatDecimal(report.dueAmount, 1, 2)}">0.00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
