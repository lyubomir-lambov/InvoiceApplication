<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
</header>

<main>
    <section class="auth">
        <div class="auth-panel">
            <div class="auth-header">
                <h1>Registration successful</h1>
                <p>Your account has been created successfully.</p>
            </div>

            <div th:if="${user != null}">
                <div class="form-group">
                    <label>Username</label>
                    <p th:text="${user.username}">username</p>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <p th:text="${user.email}">email@example.com</p>
                </div>

                <div class="form-group">
                    <label>Registered on</label>
                    <p th:text="${#temporals.format(user.createdOn, 'dd-MM-yyyy HH:mm:ss')}">01-06-2026 12:00:00</p>
                </div>
            </div>

            <a class="button button-primary form-submit" th:href="@{/login}" href="/login">Login</a>
        </div>
    </section>
</main>
</body>
</html>
