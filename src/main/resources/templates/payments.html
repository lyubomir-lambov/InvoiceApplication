<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | Invoice Application</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<header class="page-header">
    <a class="brand" th:href="@{/}">Invoice Application</a>
    <nav class="navigation" aria-label="Main navigation">
        <a class="nav-button" th:href="@{/invoices}" href="/invoices">Invoices</a>
        <a class="nav-button" th:href="@{/clients}" href="/clients">Clients</a>
        <a class="nav-button nav-button-active" th:href="@{/payments}" href="/payments">Payments</a>
    </nav>
    <nav class="navigation" aria-label="User navigation" style="margin-left: auto;">
        <span th:text="${username}" style="display: inline-flex; align-items: center; min-height: 40px; color: var(--primary); font-size: 15px; font-weight: 700;">username</span>
        <form th:action="@{/logout}" action="/logout" method="post" style="margin: 0;">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="list-page">
    <section class="content-shell">
        <div class="table-card">
            <table class="invoices-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Amount</th>
                    <th>Currency</th>
                    <th>Notes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(payments)}">
                    <td colspan="5">No payments found.</td>
                </tr>
                <tr th:each="payment : ${payments}">
                    <td th:text="${payment.paymentDate}">2026-06-21</td>
                    <td th:text="${payment.client.displayName}">Acme Sofia</td>
                    <td th:text="${payment.amount}">0.00</td>
                    <td th:text="${payment.currency.code}">BGN</td>
                    <td th:text="${payment.notes != null && !payment.notes.isBlank() ? payment.notes : '-'}">Payment note</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
